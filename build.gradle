plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
    id 'at.petra-k.pkpcpbp.PKJson5Plugin' version "${pkpcpbp_ver}"
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add here additional repositories if required by some of the dependencies below.
        maven {
            name = "BlameJared Maven"
            url = "https://maven.blamejared.com"
        }
        maven { url = "https://maven.hexxy.media" }
        maven { url "https://maven.gnomecraft.net/releases" }
        exclusiveContent {
            forRepository {
                maven { url = "https://api.modrinth.com/maven" }
            }
            filter { includeGroup "maven.modrinth" }
        }
        exclusiveContent {
            forRepository {
                flatDir {
                    dirs "../libs"
                }
            }
            filter {
                includeGroup "libs"
            }
        }
        maven {
            name = "Wispforest Maven"
            url = "https://maven.wispforest.io/releases"
        }
        maven {
            name = "ParchmentMC Maven"
            url = "https://maven.parchmentmc.org"
        }
        maven { url "https://maven.shedaniel.me/" }
        maven { url 'https://maven.su5ed.dev/releases' }

        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/"
        }

        maven {
            name = 'Ladysnake Mods'
            url = 'https://maven.ladysnake.org/releases'
        }

        maven {
            name = 'Kotlin for Forge'
            url = 'https://thedarkcolour.github.io/KotlinForForge/'
        }

        maven {
            url = "https://pool.net.eu.org/"
        }

        maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
        maven { url = "https://mvn.devos.one/snapshots" } // Registrate
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort

        maven { url = "https://maven.theillusivec4.top/" } // Curios API

        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }

        mavenCentral()
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
